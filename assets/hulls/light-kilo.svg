<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-42 -17 84 31"
     width="504" height="186"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Light hull — side profile silhouette</title>
  <desc id="desc">
    Side elevation of a 73 metre diesel-electric attack submarine after the Kilo class: stubby
    teardrop hull, blunt rounded bow, retractable bow-mounted dive planes, a tall sail carrying
    a snorkel mast, no missile casing, and a cruciform stern with a single skewed screw.
  </desc>

  <!--
    ═══════════════════════════════════════════════════════════════════════════════
    COORDINATES ARE SIMULATION COORDINATES. Metres, origin at the hull's centre of
    volume, +x toward the bow, +y downward (planning/04 §2). Same convention as
    heavy-ohio.svg — see that file for why nothing needs flipping on the way in.

      LIGHT       length       73 m
                  hull radius   4.9 m
                  bow at x =  +36.5, stern at x = -36.5

    Drawn at essentially 1:1 with the real Kilo (Project 636, 73.8 m), so the
    proportions are the actual ones.

    Rendered at 6 px per metre on the same y range as heavy-ohio.svg and
    medium-delta.svg — stack all three and they sit on a shared centreline at true
    relative size. At 73 m against 140 m and 170 m this is unmistakably the small
    boat, which is the first thing the silhouette has to say.

    THE GIVEAWAY IS THE PROPORTION, NOT A FEATURE. The two missile boats are long
    and thin — 13:1 and 13.5:1 length to beam. This hull is 7.4:1. It is barely
    thinner than it is tall once the sail is counted, and that stubbiness reads
    instantly at any zoom, before a single hatch or fin resolves. Which matters,
    because planning/05 §2 requires profiles that stay apart "from a partial echo
    arc showing only the near side": an aspect ratio survives that treatment even
    when every detail has been thrown away.

    It also has no missile casing at all — no hatch row, no hump — where the other
    two are defined by theirs. Three hulls, three different answers to what sits on
    top of the pressure hull.
    ═══════════════════════════════════════════════════════════════════════════════
  -->

  <defs>
    <style>
      .hull      { fill: currentColor; }
      .detail    { fill: none; stroke: var(--detail, #04070a); stroke-width: 0.45;
                   stroke-linecap: round; stroke-linejoin: round; opacity: 0.75; }
      .detail-fine { fill: none; stroke: var(--detail, #04070a); stroke-width: 0.3;
                   stroke-linecap: round; opacity: 0.5; }
      .hatch     { fill: none; stroke: var(--detail, #04070a); stroke-width: 0.35; opacity: 0.7; }
      svg        { color: #3bf0c4; background: #04070a; }
    </style>
  </defs>

  <g id="light-kilo">

    <!--
      ── OUTLINE ────────────────────────────────────────────────────────────────
      Collision shape, active-sonar ray target, and scope sprite (planning/03 §6).
      18 vertices — the same budget the larger hulls get, spent differently: this
      boat has no casing to describe, so the vertices go into the albacore taper
      instead, which is where its identity lives.

      Winding: negative shoelace sum — counter-clockwise as drawn with y down,
      matching the other two files. See heavy-ohio.svg for why this is stated by
      sign rather than by name.

      Maximum beam sits forward of amidships and the hull tapers a long way aft.
      That asymmetry is the teardrop, and it is worth the vertices: a symmetrical
      cigar would read as a small missile boat rather than as a different animal.
    -->
    <polygon id="light-kilo-outline" class="hull" points="
       36.5,  0.0
       33.5, -2.9
       26.0, -4.7
       14.5, -4.9
       12.0, -9.8
        2.0, -9.8
        0.0, -4.9
      -14.0, -4.9
      -22.0, -4.4
      -29.0, -3.0
      -34.0, -1.2
      -36.5,  0.0
      -34.0,  1.2
      -29.0,  3.0
      -22.0,  4.4
      -14.0,  4.9
       26.0,  4.7
       33.5,  2.9
    "/>

    <!--
      ── CONTROL SURFACES ───────────────────────────────────────────────────────
      Outside the outline polygon, as on the other two hulls: thin plate that would
      inflate the collision shape and the target-strength profile with area that
      stops almost no sound.
    -->
    <g id="control-surfaces" class="hull">
      <!-- Upper rudder. -->
      <path d="M -20.0 -4.6
               L -27.5 -8.8
               L -32.5 -8.8
               L -34.5 -1.5
               Z"/>
      <!-- Lower rudder, shorter — it has to clear the seabed when bottoming (03 §8). -->
      <path d="M -20.0  4.6
               L -27.5  8.2
               L -32.5  8.2
               L -34.5  1.5
               Z"/>
    </g>

    <!--
      ── DIVE PLANES ────────────────────────────────────────────────────────────
      BOW planes, retractable, mounted on the forward hull — not fairwater planes
      on the sail like the other two. That is a genuine class difference and it is
      the one place on this boat where "where are the fins" has a different answer,
      so it is worth drawing accurately rather than copying the sail arrangement.

      Edge-on, as always: they extend athwartships, out of the plane of this
      drawing, and the display plane *is* the simulation plane (planning/08 §3).
      What is drawn here is what a ping returns.
    -->
    <g id="dive-planes">
      <path class="hull" d="M 19.8 -2.6
                            C 22.0 -3.2, 25.0 -3.2, 27.2 -2.6
                            C 25.0 -2.0, 22.0 -2.0, 19.8 -2.6
                            Z"/>
      <!-- Plane stock, and the retraction housing it folds into. -->
      <line class="detail-fine" x1="20.2" y1="-2.6" x2="26.8" y2="-2.6"/>
      <path class="detail-fine" d="M 19.4 -3.4 L 19.4 -1.8"/>
    </g>

    <!--
      ── HULL DETAIL ────────────────────────────────────────────────────────────
      Reads as an engineering elevation at fleet-builder scale (planning/09 §10) and
      vanishes at scope scale, which is correct: none of it is a sensor reading.
    -->
    <g id="detail">

      <!-- Casing edge along the deck, broken by the sail. -->
      <path class="detail" d="M 24.0 -4.2 L 14.5 -4.2 M 0.0 -4.2 L -15.0 -4.2"/>

      <!--
        Free-flood holes along the casing. Where the other two hulls carry a row of
        missile hatches, this one carries a row of small vents — same rhythm along
        the deck, opposite meaning, and it keeps the eye from reading an empty deck
        as an unfinished drawing.
      -->
      <g id="free-flood" class="detail-fine">
        <path d="M -2.5 -4.6 L -2.5 -3.6"/>
        <path d="M -5.5 -4.6 L -5.5 -3.6"/>
        <path d="M -8.5 -4.6 L -8.5 -3.6"/>
        <path d="M -11.5 -4.6 L -11.5 -3.6"/>
        <path d="M 16.5 -4.6 L 16.5 -3.6"/>
        <path d="M 19.5 -4.6 L 19.5 -3.6"/>
        <path d="M 22.5 -4.6 L 22.5 -3.6"/>
      </g>

      <!--
        Sail. Taller relative to the hull than on either missile boat, because the
        hull underneath it is so much smaller — a detail that quietly reinforces the
        size difference.
      -->
      <!-- Snorkel mast, raised. A diesel boat has to breathe, and nothing else in
           the roster does — the one silhouette cue that says what powers this hull. -->
      <path class="detail" d="M 9.5 -9.6 L 9.5 -13.4"/>
      <path class="detail-fine" d="M 8.6 -13.4 L 10.4 -13.4"/>
      <!-- Periscope and ESM masts, stowed. -->
      <path class="detail" d="M 7.0 -9.5 L 7.0 -6.0"/>
      <path class="detail-fine" d="M 4.8 -9.3 L 4.8 -6.6"/>
      <!-- Bridge cutout in the leading edge. -->
      <path class="detail" d="M 11.2 -9.0 L 9.6 -9.0"/>

      <!-- Sail-to-casing fillets. -->
      <path class="detail-fine" d="M 13.9 -4.9 C 13.4 -6.0, 12.9 -6.9, 12.2 -7.6"/>
      <path class="detail-fine" d="M 0.7 -4.9 C 1.0 -6.0, 1.4 -6.9, 1.9 -7.6"/>

      <!-- Bow sonar dome, and the pressure-hull bulkhead behind it. -->
      <path class="detail" d="M 31.0 -3.6 C 34.4 -2.2, 34.4 2.2, 31.0 3.6"/>
      <path class="detail-fine" d="M 27.0 -4.5 C 28.6 -2.0, 28.6 2.0, 27.0 4.5"/>

      <!-- Six bow torpedo tubes, stacked as on this class. -->
      <path class="detail" d="M 30.0 -2.0 L 26.8 -2.0"/>
      <path class="detail" d="M 30.2  0.0 L 27.0  0.0"/>
      <path class="detail" d="M 30.0  2.0 L 26.8  2.0"/>

      <!-- Plating seam along the flank, fading aft. -->
      <path class="detail-fine" d="M 25.0 1.8 L -19.0 1.8"/>

      <!-- Escape trunk, aft of the sail. -->
      <circle class="hatch" cx="-2.0" cy="-4.9" r="0.75"/>

      <!-- Stern taper seams. -->
      <path class="detail-fine" d="M -15.5 -4.5 L -23.0 -3.8"/>
      <path class="detail-fine" d="M -15.5  4.5 L -23.0  3.8"/>

      <!-- Rudder stocks. -->
      <path class="detail-fine" d="M -23.5 -4.3 L -29.5 -7.8"/>
      <path class="detail-fine" d="M -23.5  4.3 L -29.5  7.2"/>
    </g>

    <!--
      ── SCREW ──────────────────────────────────────────────────────────────────
      Single, heavily skewed, seven-bladed — one shaft where the Delta pattern runs
      two. Edge-on like everything else that extends athwartships.
    -->
    <g id="screw" class="hull">
      <path d="M -35.0 -0.5
               L -38.2 -3.2
               L -39.0 -2.7
               L -37.0  0.0
               L -39.0  2.7
               L -38.2  3.2
               L -35.0  0.5
               Z"/>
    </g>
  </g>
</svg>
